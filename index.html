---
layout: default
title: 首页
---

<section class="scroll-section hero-section-1">
  <div class="text-container">
    <h1 class="apple-title-1">
      <span class="line-1"></span>
      <span class="line-2 gradient-text"></span>
    </h1>
  </div>
</section>

<section class="scroll-section hero-section-2">
  <div class="text-container">
    <h2 class="apple-title-2">
      <span class="line-1">大道</span>
      <span class="line-2">至<span class="underlined-text">简</span>。</span>
    </h2>
  </div>
</section>

<section class="blog-list-section">
  <div class="content-wrapper">
    <h3 class="section-title">沉淀与思考 <span class="animated-dot"></span></h3>
    <ul class="apple-post-list">
      {% for post in site.posts %}
        <li class="post-card">
          <span class="post-date">{{ post.date | date: "%Y年%m月%d日" }}</span>
          <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
