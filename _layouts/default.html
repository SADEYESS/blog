<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | escape }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
    <!-- Auto-render Extension -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof katex === "undefined" || typeof renderMathInElement !== "function") return;

            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '\\begin{equation}', right: '\\end{equation}', display: true},
                    {left: '\\begin{align}', right: '\\end{align}', display: true}
                ],
                throwOnError: false
            });

            // 渲染 Jekyll Kramdown 编译生成的 <script type="math/tex"> 标签
            document.querySelectorAll('script[type="math/tex"]').forEach(node => {
                const el = document.createElement('span');
                katex.render(node.textContent, el, { displayMode: false, throwOnError: false });
                node.parentNode.replaceChild(el, node);
            });
            document.querySelectorAll('script[type="math/tex; mode=display"]').forEach(node => {
                const el = document.createElement('div');
                katex.render(node.textContent, el, { displayMode: true, throwOnError: false });
                node.parentNode.replaceChild(el, node);
            });
        });
    </script>
</head>
<body>
    <header class="nav-header">
        <h1><a href="{{ '/' | relative_url }}">我的个人博客</a></h1>
        <nav>
            <a href="{{ '/' | relative_url }}#blog-list">首页文章</a> 
            <a href="{{ '/about' | relative_url }}">关于</a>
        </nav>
    </header>

    <main class="site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>© 2026 个人版权所有</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        // 注册滚动触发插件
        gsap.registerPlugin(ScrollTrigger);

        // 打字机效果动画
        document.addEventListener("DOMContentLoaded", () => {
            const line1 = document.querySelector(".apple-title-1 .line-1");
            const line2 = document.querySelector(".apple-title-1 .line-2");
            
            if (line1 && line2) {
                const text1 = "Simple is better";
                const text2 = "than complex.";
                
                // 创建闪烁的光标
                const cursor = document.createElement("span");
                cursor.className = "typing-cursor";
                cursor.textContent = "|";
                
                line1.appendChild(cursor);
                
                let i = 0;
                let j = 0;
                const speed = 100; // 打字速度（毫秒）
                
                function typeLine1() {
                    if (i < text1.length) {
                        cursor.before(text1[i]);
                        i++;
                        setTimeout(typeLine1, speed);
                    } else {
                        // 第一行打完，光标移到第二行
                        line2.appendChild(cursor);
                        setTimeout(typeLine2, speed * 4); // 停顿一下再打第二行
                    }
                }
                
                function typeLine2() {
                    if (j < text2.length) {
                        cursor.before(text2[j]);
                        j++;
                        setTimeout(typeLine2, speed);
                    }
                }
                
                setTimeout(typeLine1, 600); // 稍微延迟开始，给页面加载留出时间
            }
        });

        // 1. 第一幕：大字随滚动平滑放大并淡出
        gsap.to(".apple-title-1", {
            scrollTrigger: {
                trigger: ".hero-section-1",
                start: "top top",
                end: "bottom top",
                scrub: true, // 关键：动画紧密绑定滚轮滚动速度
                pin: true    // 滚动时固定住当前视口
            },
            scale: 1.15,
            opacity: 0,
            y: -50
        });

        // 2. 第二幕：副标题随滚动平滑淡入并上浮
        gsap.fromTo(".apple-title-2", 
            { opacity: 0, y: 100, scale: 0.9 },
            {
                scrollTrigger: {
                    trigger: ".hero-section-2",
                    start: "top bottom",
                    end: "center center",
                    scrub: 1 // 带有 1 秒的物理惯性缓冲，极为丝滑
                },
                opacity: 1,
                y: 0,
                scale: 1
            }
        );

        // 3. 第三幕：文章列表优雅淡入
        gsap.from(".post-card", {
            scrollTrigger: {
                trigger: ".blog-list-section",
                start: "top 80%",
                toggleActions: "play none none none"
            },
            opacity: 0,
            y: 30,
            duration: 0.8,
            stagger: 0.1 // 列表项错落有致地依次淡入
        });
    </script>

    <!-- Render fenced Mermaid diagrams after the page and fonts are loaded. -->
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

        window.addEventListener("load", async () => {
            document.querySelectorAll(
                ".post-container pre > code.language-mermaid, .post-container pre > code.lang-mermaid"
            ).forEach(code => {
                const diagram = document.createElement("div");
                diagram.className = "mermaid";
                diagram.textContent = code.textContent;
                code.parentElement.replaceWith(diagram);
            });

            const diagrams = document.querySelectorAll(".post-container .mermaid");
            if (!diagrams.length) return;

            mermaid.initialize({
                startOnLoad: false,
                securityLevel: "strict",
                theme: "default"
            });

            try {
                await mermaid.run({ nodes: diagrams });
            } catch (error) {
                console.error("Mermaid rendering failed:", error);
            }
        });
    </script>

    <!-- Load lightweight mouse ripple effect -->
    <script defer src="{{ '/ripple.js' | relative_url }}"></script>
</body>
</html>
